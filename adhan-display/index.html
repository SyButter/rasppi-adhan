<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prayer Times</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- link to our CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Prayer Times</h1>
    <div id="date"></div>
  </header>

  <ul id="times">
    <!-- JS will inject today's times here -->
  </ul>

  <div id="next">
    Next: <span id="nextName"></span> in <span id="countdown"></span>
  </div>

  <section id="jummah-schedule">
  <h2>Next Jummah Khateeb</h2>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>First Jummah</th>
        <th>Second Jummah</th>
      </tr>
    </thead>
    <tbody>
      <!-- we’ll fill this in via script.js -->
    </tbody>
  </table>
</section>


  <!-- PrayTimes library -->
  <script src="prayTimes.js"></script>
  <!-- our display logic -->
  <script src="script.js"></script>
</body>
</html>
